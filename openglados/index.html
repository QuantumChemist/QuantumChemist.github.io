<!DOCTYPE html>
<html lang="en" data-theme="chaos">
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' href='style.css'>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
<title>OpenGLaDOS - Where Science Meets Insanity</title>
<style>
:root { --bg: #0d0d0d; --fg: #00ff00; --accent: #ff0066; --glitch: #00ffff; --warn: #ffaa00; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    font-family: 'Courier New', 'VT323', monospace; 
    background: var(--bg); 
    color: var(--fg); 
    overflow-x: hidden; 
    position: relative;
    line-height: 1.6;
}
body::before { 
    content: ""; 
    position: fixed; 
    inset: 0; 
    background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03), rgba(0,255,0,0.03) 1px, transparent
</body>

</html>
